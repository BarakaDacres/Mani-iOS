name: Mani
options:
  bundleIdPrefix: com.barakadacres
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en-AU
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

packages:
  IncomeKit:
    path: IncomeKit

targets:
  Mani:
    type: application
    platform: iOS
    sources:
      - path: Mani
      - path: Shared
    dependencies:
      - package: IncomeKit
      - target: ManiWidget
        embed: true
      - sdk: Charts.framework
      - sdk: WidgetKit.framework
    entitlements:
      path: Mani/Mani.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP)]
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.developer.icloud-container-identifiers: [$(ICLOUD_CONTAINER)]
        aps-environment: development
    info:
      path: Mani/Info.plist
      properties:
        CFBundleDisplayName: Mani
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes: [remote-notification]
        APP_GROUP: $(APP_GROUP)
        ICLOUD_CONTAINER: $(ICLOUD_CONTAINER)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.barakadacres.mani
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
    scheme:
      testTargets: [ManiTests]
      gatherCoverageData: true

  ManiWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: ManiWidget
      - path: Shared
    dependencies:
      - package: IncomeKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    entitlements:
      path: ManiWidget/ManiWidget.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP)]
    info:
      path: ManiWidget/Info.plist
      properties:
        CFBundleDisplayName: Mani
        APP_GROUP: $(APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.barakadacres.mani.widget

  ManiTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ManiTests]
    dependencies:
      - target: Mani
      - package: IncomeKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
